[project]
name = "nanki"
version = "0.1.0"
description = "A tool for converting Markdown notes into neat-looking Anki cards."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "jsonschema>=4.25.1",
    "mistune==2.0.4",
    "pygments>=2.19.2",
    "python-frontmatter>=1.1.0",
    "requests>=2.32.5",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
nanki = "nanki.main:main"

[build-system]
requires = ["setuptools>=80.9.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
